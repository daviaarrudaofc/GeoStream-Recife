services:
  geostream-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: geostream-api
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
    volumes:
      - ../../data:/app/data
      - ../../runtime:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Add Redis for caching
  redis:
    image: redis:7-alpine
    container_name: geostream-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
